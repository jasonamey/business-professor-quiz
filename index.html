<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Business Faculty Appointments</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* Layout: one centered reading column, one question per screen; results and review are long single-column documents */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#15202E; --muted:#566173; --line:#D8DEE6;
  --accent:#1F4E79; --accent-ink:#FFFFFF; --accent-soft:#E3EBF4;
  --side-a:#1D6656; --side-a-soft:#E0F0EA; --side-b:#8A5316; --side-b-soft:#F5E9DA;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151C; --surface:#18202A; --ink:#E6EBF1; --muted:#9BA7B7; --line:#2C3644;
  --accent:#86B4E0; --accent-ink:#0D1620; --accent-soft:#1D2A39;
  --side-a:#7BC6B1; --side-a-soft:#17302A; --side-b:#E3B274; --side-b-soft:#33281A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202A; --ink:#E6EBF1; --muted:#9BA7B7; --line:#2C3644;
  --accent:#86B4E0; --accent-ink:#0D1620; --accent-soft:#1D2A39;
  --side-a:#7BC6B1; --side-a-soft:#17302A; --side-b:#E3B274; --side-b-soft:#33281A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
.wrap{max-width:46rem;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.brand{font-size:.75rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--font-display);font-weight:500;font-size:2.4rem;line-height:1.12}
h2{font-family:var(--font-display);font-weight:500;font-size:1.65rem;line-height:1.25}
h3{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1:focus,h2:focus{outline:none}
p{margin:0}
.lede{font-size:1.1rem;color:var(--muted);max-width:40rem}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-weight:600;font-size:.95rem;border-radius:8px;padding:11px 20px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 12px;font-size:.82rem;font-weight:500}
.linkish{font:inherit;font-size:.85rem;background:none;border:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0}
.linkish:hover{color:var(--ink)}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.steps b{display:block}
.steps .n{font-family:var(--font-display);font-size:1.4rem;line-height:1;color:var(--accent);width:1.4rem}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* quiz */
.qhead{display:flex;flex-direction:column;gap:10px}
.parts{display:flex;gap:6px;flex-wrap:wrap;font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.parts span{padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.parts span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.parts span.done{color:var(--accent);border-color:var(--accent)}
.prog{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.bg{color:var(--muted);font-size:1rem;max-width:42rem}
.bg-label{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
fieldset{border:none;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:12px}
legend{font-weight:600;font-size:1rem;padding:0;margin-bottom:12px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.side{border-radius:10px;padding:14px 16px;border:1px solid;min-width:0}
.side .tag{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;display:block;margin-bottom:4px}
.side.a{background:var(--side-a-soft);border-color:var(--side-a)}
.side.a .tag{color:var(--side-a)}
.side.b{background:var(--side-b-soft);border-color:var(--side-b)}
.side.b .tag{color:var(--side-b)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg{position:relative;display:block;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:56px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.82rem;line-height:1.25;color:var(--ink);transition:background .12s,border-color .12s}
.seg span b{font-size:1rem}
.seg:hover span{border-color:var(--muted)}
.seg input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.seg.a input:checked + span{background:var(--side-a);border-color:var(--side-a);color:var(--surface)}
.seg.b input:checked + span{background:var(--side-b);border-color:var(--side-b);color:var(--surface)}
.seg.mid input:checked + span,.seg.int input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.hint{font-size:.85rem;color:var(--muted)}

/* results */
.appointment{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.appointment-inner{border:1px solid var(--accent);border-radius:8px;padding:28px 24px;display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}
.appointment .kicker{font-size:.75rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.appointment h1{font-size:2.3rem}
.appointment .spec{font-family:var(--font-display);font-size:1.35rem;font-style:italic;color:var(--ink)}
.appointment .basis{font-size:.85rem;color:var(--muted);margin-top:8px}
.agenda{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.agenda li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.agenda .rq{font-family:var(--font-display);font-size:1.15rem;line-height:1.35}
.agenda .pos{font-size:.92rem}
.agenda .pos em{font-style:normal;font-weight:600}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.78rem}
.pill{padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.a{color:var(--side-a);border-color:var(--side-a)}
.pill.b{color:var(--side-b);border-color:var(--side-b)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:4px 10px;font-size:.88rem}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,13rem) 1fr 2.6rem;gap:10px;align-items:center;font-size:.88rem}
.brow .lbl{min-width:0;overflow-wrap:anywhere}
.brow .trk{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.brow .trk i{display:block;height:100%;background:var(--muted);border-radius:5px}
.brow.win .trk i{background:var(--accent)}
.brow.win .lbl{font-weight:600}
.brow .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.runner{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-top:1px solid var(--line)}
.runner:first-child{border-top:none;padding-top:0}
.runner b{font-size:1rem}
select{font:inherit;font-size:.95rem;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}

/* review */
.jump{display:flex;flex-wrap:wrap;gap:8px}
.rv-field{display:flex;flex-direction:column;gap:20px;scroll-margin-top:16px}
.rv-field > h2{font-size:2rem;border-bottom:2px solid var(--ink);padding-bottom:6px}
.rv-sub{display:flex;flex-direction:column;gap:12px}
.rv-sub > .rv-head{display:flex;flex-direction:column;gap:6px}
.rv-sub h3.rv-title{font-family:var(--font-display);font-size:1.35rem;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:500}
.rv-q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:7.5rem 1fr;gap:6px 14px;font-size:.92rem;break-inside:avoid}
.rv-q dt{font-size:.72rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.rv-q dd{margin:0;min-width:0}
.rv-q .qid{grid-column:1/-1;font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--accent);font-variant-numeric:tabular-nums}
.rv-q dd.prompt{font-family:var(--font-display);font-size:1.1rem}
.rv-q dd.pa{color:var(--side-a)}
.rv-q dd.pb{color:var(--side-b)}
code{font-size:.9em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}

@media (max-width:560px){
  h1{font-size:1.9rem}
  h2{font-size:1.4rem}
  .sides{grid-template-columns:1fr}
  .seg span{font-size:.74rem;min-height:52px}
  .brow{grid-template-columns:minmax(0,8rem) 1fr 2.4rem}
  .rv-q{grid-template-columns:1fr}
  .rv-q dt{padding-top:6px}
  .appointment h1{font-size:1.8rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.no-print{display:none!important}body{background:#fff}.rv-q,.agenda li,.panel{border-color:#999}}
</style>

<div id="app" class="wrap" aria-live="polite"></div>

<script>
/* =====================================================================
   QUESTION BANK — EDIT HERE
   5 fields × 5 specialties × 5 questions = 125 questions.
   Each question has:
     original   – the instructor's wording (shown on results and review pages)
     question   – the version students see
     background – context and definitions shown under the question
     positionA / positionB – the two sides students choose between
   Question IDs (e.g. "acc-fr-1") come from the order below. If you
   reorder or remove questions, students with saved progress restart.
   ===================================================================== */
const FIELDS = [
{ id:"acc", name:"Accountancy",
  about:"Accountancy studies how organizations measure, record, check, and report financial information, and how investors, managers, tax authorities, and investigators use that information.",
  subfields:[
  { id:"acc-fr", name:"Financial Reporting",
    about:"How companies present their financial results to investors, lenders, and the public: what goes into financial statements, how items are measured, and who writes the rules.",
    terms:["financial statements","GAAP","IFRS","FASB","IASB","intangible assets","fair value accounting","non-GAAP measures","ESG disclosure","ISSB standards"],
    questions:[
    { original:"Should intangibles like data, brands, and R&D be capitalized on the balance sheet, or kept off because they're too hard to value reliably?",
      question:"Should a company's balance sheet list valuable non-physical assets, such as its customer data, its brand, or its research, or leave them off because their value is too hard to pin down?",
      background:"A balance sheet lists what a company owns (its assets) and what it owes. Physical items like factories and equipment are recorded as assets. Under current U.S. rules, though, most of what a company spends building its own brand or on research and development (R&D) is recorded as an expense in the year it is spent, so it never appears as an asset. “Capitalizing” a cost means recording it as an asset instead. Critics say this makes companies like Google or Pfizer look less valuable on paper than they really are.",
      positionA:"Record them as assets. Leaving them off hides what modern companies are actually worth.",
      positionB:"Keep them off. Their values would be estimates, and estimates invite manipulation." },
    { original:"Is fair-value accounting more informative than historical cost, or does it make volatility worse in a crisis?",
      question:"Should companies report their assets at today's market value, or at the price they originally paid?",
      background:"“Historical cost” accounting records an asset at its purchase price. “Fair-value” accounting (also called “mark-to-market”) updates the asset to what it could be sold for today. Fair value is more current. But during the 2008 financial crisis, critics argued that forcing banks to mark their assets down to panic-level prices made their losses look worse and deepened the crisis.",
      positionA:"Today's market value. Investors need current information, even if the numbers move around.",
      positionB:"The original price. It is stable, can be verified, and doesn't amplify panics." },
    { original:"Do non-GAAP metrics (“adjusted EBITDA”) help investors, or mainly let managers flatter results?",
      question:"When companies publish their own “adjusted” profit figures alongside the official ones, does that help investors or mainly make results look better than they are?",
      background:"U.S. public companies must report profits using GAAP (Generally Accepted Accounting Principles), the official rulebook. Many also report “non-GAAP” figures such as “adjusted EBITDA”: earnings before interest, taxes, depreciation, and amortization, with certain “one-time” costs removed. Managers say this shows how the core business is performing. Skeptics point out that the costs labeled “one-time” often come back year after year.",
      positionA:"Helpful. Adjusted figures show how the core business is really performing.",
      positionB:"Mostly flattering. Managers choose what to leave out, and they tend to leave out the bad news." },
    { original:"Should sustainability and climate disclosures be mandatory and standardized, or left to the market?",
      question:"Should companies be required to report their environmental and climate impact in a standard format, or should that be left to each company and its investors?",
      background:"Many investors want to know a company's carbon emissions and its exposure to climate risks, such as flooding at its factories. The European Union now requires detailed sustainability reporting. In the U.S., a federal climate-disclosure rule was adopted in 2024 and then stalled amid lawsuits and political opposition, while California passed its own requirements. Supporters say a standard format makes companies comparable. Opponents point to the cost and question whether these issues belong in financial reports at all.",
      positionA:"Mandatory and standardized. Otherwise companies report only what makes them look good.",
      positionB:"Voluntary. Investors who care can ask for it, without imposing the cost on every company." },
    { original:"Would one global set of standards (IFRS everywhere) improve comparability, or erase useful local differences?",
      question:"Should every country use the same set of accounting rules, or is there value in countries keeping their own?",
      background:"About 140 countries and jurisdictions require IFRS (International Financial Reporting Standards) for public companies. The U.S. uses its own rules, called GAAP. A single global standard would make it easier to compare, say, a German company with an American one. But countries differ in their legal systems, tax rules, and how companies raise money, and some argue that accounting rules should fit local conditions.",
      positionA:"One global standard. Being able to compare companies across borders matters most.",
      positionB:"Local rules. Different economies have legitimately different needs." }
    ]},
  { id:"acc-au", name:"Auditing",
    about:"How independent accountants check whether a company's financial statements are accurate, and how to keep those checkers honest and effective.",
    terms:["external audit","auditor independence","PCAOB","Sarbanes-Oxley Act","Big Four accounting firms","mandatory audit firm rotation","reasonable assurance","audit expectation gap","audit data analytics"],
    questions:[
    { original:"Will AI and full-population testing improve audit quality, or create risks auditors can't see?",
      question:"Will artificial intelligence that can check every single transaction make audits better, or create new risks that auditors can't see?",
      background:"Auditors have traditionally been unable to check every transaction, so they test a sample and draw conclusions from it. AI and data-analysis tools now make it possible to examine the “full population” of transactions. That could catch more errors. But auditors may come to trust tools they don't fully understand, and an AI system may miss problems it was never designed to recognize.",
      positionA:"Better audits. Checking everything beats checking a sample.",
      positionB:"Hidden risks. Auditors could end up relying on tools they don't understand." },
    { original:"Does mandatory auditor rotation protect independence, or throw away valuable client knowledge?",
      question:"Should companies be required to switch to a different audit firm every several years?",
      background:"An auditor is paid by the company it audits. After many years together, critics worry, the auditor becomes too comfortable with management to challenge it. The European Union requires large public companies to change audit firms, generally after 10 years. The U.S. requires only that the lead audit partner change every five years. Opponents argue that a new firm needs years to learn a complex business, and that errors are more common in the first years of a new audit relationship.",
      positionA:"Require rotation. Fresh eyes protect the auditor's independence.",
      positionB:"Don't require it. Long relationships build the knowledge needed to spot problems." },
    { original:"Should audit firms be allowed to sell consulting services to the clients they audit?",
      question:"Should an accounting firm be allowed to sell consulting services to the same company it audits?",
      background:"Audit firms also sell advice on technology, taxes, and strategy. When the energy company Enron collapsed in 2001, its auditor, Arthur Andersen, had been earning more from Enron for consulting than for auditing. The Sarbanes-Oxley Act of 2002 banned many kinds of consulting for audit clients, but some services are still allowed, and the large firms still earn a large share of their revenue from non-audit work.",
      positionA:"Allow it, within limits. Knowing a client well can improve both services.",
      positionB:"Ban it. A firm can't objectively audit a client it is also trying to sell to." },
    { original:"Is the Big Four's concentration a quality advantage or a systemic risk?",
      question:"Is it a strength or a danger that just four firms audit nearly all of the largest companies?",
      background:"Deloitte, PwC, EY, and KPMG, known as the “Big Four,” audit nearly all of the largest public companies in the U.S. and the U.K. Their size gives them expertise and global reach. But if one of them collapsed, as Arthur Andersen did in 2002, there might not be enough capacity left to audit the world's largest companies, and having so few competitors may reduce pressure to improve.",
      positionA:"A strength. Only very large firms can audit very large, global companies.",
      positionB:"A danger. Too few firms means too little competition and too much riding on each one." },
    { original:"Should auditors be responsible for detecting fraud, or only for giving reasonable assurance on the statements?",
      question:"Should auditors be held responsible for finding fraud, or only for confirming that the financial statements are reasonably accurate?",
      background:"Auditors provide “reasonable assurance”: a high, but not absolute, level of confidence that financial statements are free of major errors. Much of the public assumes auditors are fraud detectors. After scandals like Wirecard in 2020, where €1.9 billion in reported cash turned out not to exist, many asked how the auditors missed it. The gap between what the public expects and what auditors actually promise is called the “expectation gap.”",
      positionA:"Responsible for finding fraud. That is what the public needs auditors to do.",
      positionB:"Reasonable assurance only. A determined fraudster can fool any outside reviewer." }
    ]},
  { id:"acc-tx", name:"Taxation",
    about:"How governments tax businesses, how businesses plan around taxes, and how tax rules shape investment and behavior.",
    terms:["corporate income tax","profit shifting","tax havens","OECD Pillar Two","global minimum tax","digital services tax","Tax Cuts and Jobs Act","tax avoidance vs. tax evasion","tax expenditures"],
    questions:[
    { original:"Will a global minimum corporate tax end profit shifting, or just move it elsewhere?",
      question:"Will a worldwide minimum tax on large corporations stop them from moving their profits to low-tax countries?",
      background:"Multinational companies can legally record profits in countries with low taxes. For example, a company might have an Irish subsidiary own its patents and charge its other subsidiaries fees for using them. This is called “profit shifting.” In 2021, about 140 countries agreed to a 15% global minimum tax on large multinationals (the OECD's “Pillar Two”). The U.S. has not adopted it, and in 2025 it negotiated an exemption for U.S.-based companies.",
      positionA:"It will largely work. If every country charges at least 15%, shifting profits stops paying off.",
      positionB:"It will just move the problem. Companies will find new loopholes and countries will compete in other ways." },
    { original:"Should digital companies be taxed where their users are, or where the company is based?",
      question:"Should digital companies pay taxes in the countries where their users live, or where the company is based?",
      background:"Traditional tax rules tax a company where it has a physical presence, such as offices or factories. But a company like Meta or Google can earn large advertising revenue from users in France with little physical presence there. Several countries, including France and the U.K., created “digital services taxes” on that revenue. The U.S. has called these taxes unfair to American companies and has threatened retaliation.",
      positionA:"Where the users are. That is where the value is created.",
      positionB:"Where the company is based. That is where the work, investment, and risk-taking happen." },
    { original:"Do corporate tax cuts boost investment and wages, or mainly shareholder payouts?",
      question:"When governments cut corporate taxes, do companies invest more and raise wages, or mostly pay out more to shareholders?",
      background:"The 2017 Tax Cuts and Jobs Act cut the U.S. corporate tax rate from 35% to 21%. Supporters predicted more investment in equipment and factories, which would lead to higher wages. Studies since then find that investment rose somewhat, but wage gains were smaller than promised, and companies bought back record amounts of their own stock. Economists still debate how much of the benefit reached workers.",
      positionA:"Investment and wages. Lower taxes make more projects worth doing, and that helps workers.",
      positionB:"Shareholder payouts. Most of the money went to stock buybacks and dividends." },
    { original:"Is aggressive tax avoidance a legitimate duty to shareholders or a breach of corporate responsibility?",
      question:"Is paying as little tax as legally possible part of a company's duty to its owners, or is aggressive tax avoidance irresponsible?",
      background:"“Tax avoidance” is legal: using the rules to reduce taxes. “Tax evasion,” such as hiding income, is illegal. Some argue that managers work for shareholders and should not voluntarily pay more than the law requires. Others argue that companies benefit from public roads, schools, and courts, and that exploiting loopholes, even legally, shifts the cost of those services onto everyone else.",
      positionA:"A legitimate duty. If the law allows it, managers should minimize taxes.",
      positionB:"Irresponsible. Following the letter of the law while dodging its purpose is a failure of responsibility." },
    { original:"Should the tax code be used to steer behavior (credits, incentives), or kept simple and neutral?",
      question:"Should the tax system be used to encourage certain behavior, like buying electric cars or doing research, or be kept simple and neutral?",
      background:"Governments often offer tax credits or deductions to encourage activities such as research, clean energy, home ownership, and hiring. These are sometimes called “tax expenditures,” because they cost the government revenue just as direct spending does. Critics say they make the tax code complicated, favor whoever has the best lobbyists, and that a simple code with low rates would work better.",
      positionA:"Use it to encourage behavior. Tax incentives are an effective way to promote valuable activity.",
      positionB:"Keep it neutral. Simple rules are fairer and let markets decide." }
    ]},
  { id:"acc-ma", name:"Managerial Accounting",
    about:"How organizations use internal financial information, such as costs, budgets, and performance measures, to make decisions and manage people. Unlike financial reporting, this information is for managers rather than outside investors.",
    terms:["management accounting","performance measurement","Goodhart's law","budgeting","rolling forecasts","Beyond Budgeting","activity-based costing","balanced scorecard","executive compensation"],
    questions:[
    { original:"Do performance metrics improve decisions, or teach people to game the metric?",
      question:"Do performance measures help people make better decisions, or teach them to chase the number instead of the goal?",
      background:"Organizations measure performance with targets such as sales quotas, test scores, and customer wait times. The economist Charles Goodhart observed that when a measure becomes a target, it stops being a good measure, because people find ways to hit the number without achieving the real goal. In the 2010s, Wells Fargo employees opened millions of accounts customers never asked for in order to meet sales targets.",
      positionA:"Better decisions. Without measurement, there's no way to know what's working.",
      positionB:"Gaming the number. People will hit a target however is easiest, even when it hurts the organization." },
    { original:"Is traditional budgeting still useful, or should firms move to rolling forecasts or “beyond budgeting”?",
      question:"Is the traditional yearly budget still useful, or should companies plan in a more flexible way?",
      background:"Most companies set a budget once a year, and managers are judged on whether they meet it. Critics say annual budgets are out of date by the time they're approved, and that they encourage managers to set easy targets and to spend whatever is left at year end. Alternatives include “rolling forecasts,” which are updated every quarter, and “Beyond Budgeting,” which drops fixed annual targets altogether.",
      positionA:"The yearly budget still works. It creates discipline and accountability.",
      positionB:"Plan more flexibly. Conditions change too fast for a once-a-year plan." },
    { original:"Does activity-based costing justify its complexity?",
      question:"Is a more detailed method of working out what each product really costs worth the extra effort?",
      background:"Many costs, such as rent, IT, and customer service, are shared across products. Traditional methods spread these costs evenly, for example in proportion to labor hours. “Activity-based costing” traces costs to the activities that cause them, such as setting up machines or handling customer complaints. It often reveals that some products or customers are unprofitable. But it takes considerable time and data to set up and keep current.",
      positionA:"Worth it. Accurate costs keep companies from losing money without realizing it.",
      positionB:"Usually not worth it. Simpler estimates are good enough for most decisions." },
    { original:"Should managers be paid on accounting measures or on stock price?",
      question:"Should executives be rewarded based on their company's accounting profits, or on its stock price?",
      background:"Executive bonuses are often tied to accounting measures, such as earnings, or to the stock price, through stock options and shares. Accounting measures reflect what managers can control, but they can be manipulated and may encourage short-term thinking. Stock prices reflect investors' views about the company's long-term future, but they also move for reasons managers don't control, such as interest rates.",
      positionA:"Accounting measures. They reflect what managers actually control.",
      positionB:"Stock price. It ties managers to the owners' interests and the long run." },
    { original:"Do balanced scorecards improve strategy, or just add reporting overhead?",
      question:"Does tracking a mix of financial and non-financial goals improve a company's strategy, or just create more reports?",
      background:"The “balanced scorecard,” introduced by Robert Kaplan and David Norton in 1992, asks companies to track four areas: financial results, customers, internal processes, and learning and growth. The idea is that profit alone tells you how the company did in the past, not how it is positioned for the future. Critics say companies end up tracking dozens of measures that no one uses.",
      positionA:"It improves strategy. It makes managers look beyond this quarter's profit.",
      positionB:"It adds overhead. More measures mean more reporting and less focus." }
    ]},
  { id:"acc-fo", name:"Forensic Accounting",
    about:"How accountants and investigators detect, investigate, and prevent financial fraud, and how they present financial evidence in court.",
    terms:["forensic accounting","fraud detection","fraud triangle","fraud diamond","SEC whistleblower program","Benford's law","textual analysis of annual reports","blockchain analytics","Association of Certified Fraud Examiners"],
    questions:[
    { original:"Can analytics and AI detect fraud before it happens, or only after the damage is done?",
      question:"Can data analysis and artificial intelligence catch fraud before it causes damage, or only afterward?",
      background:"Fraud is often discovered long after it begins. The Association of Certified Fraud Examiners reports that a typical fraud goes on for about a year before it is detected. Data tools can now flag unusual patterns as they happen, such as a series of payments just under an approval limit. But fraudsters adapt, and AI systems can produce many false alarms or miss new schemes entirely.",
      positionA:"Before. Real-time monitoring can stop fraud while it is happening.",
      positionB:"Only after. Fraudsters adapt faster than detection tools improve." },
    { original:"Do whistleblower bounties uncover fraud, or encourage opportunistic tips?",
      question:"Do cash rewards for reporting fraud uncover real wrongdoing, or mainly attract opportunistic tips?",
      background:"Since 2011, the U.S. Securities and Exchange Commission (SEC) has paid whistleblowers 10% to 30% of the penalties it collects, when those penalties exceed $1 million, as a result of their tips. It has paid out more than $2 billion. Supporters say insiders take huge career risks and deserve compensation. Critics worry that the rewards encourage people to skip their company's internal reporting channels or to file weak claims.",
      positionA:"Real wrongdoing. Insiders need a reason to take the risk of speaking up.",
      positionB:"Opportunistic tips. Money brings low-quality claims and bypasses internal controls." },
    { original:"Are textual signals in financial reports reliable predictors of fraud, such as tone or readability?",
      question:"Can the writing in a company's financial reports, such as how upbeat or how hard to read it is, signal fraud?",
      background:"Researchers have found that companies with poor results tend to write longer, harder-to-read annual reports, possibly to obscure bad news. Others have analyzed the language executives use on calls with investors for signs of deception. Investors and regulators now use these tools. But writing style varies for many innocent reasons, and executives can learn to sound honest.",
      positionA:"Reliable. How people write reveals what they are trying to hide.",
      positionB:"Unreliable. Writing style varies for too many innocent reasons." },
    { original:"Is the “fraud triangle” (pressure, opportunity, rationalization) still an adequate model?",
      question:"Is the classic explanation of why people commit fraud, which points to pressure, opportunity, and self-justification, still good enough?",
      background:"The “fraud triangle,” based on criminologist Donald Cressey's research in the 1950s, says fraud happens when three things combine: pressure (such as debt or demanding targets), opportunity (such as weak controls), and rationalization (“I'll pay it back”). Critics say it focuses on individual employees and misses organized schemes, the personal capabilities of powerful executives, and corporate cultures in which fraud becomes normal.",
      positionA:"Still adequate. The three factors explain most fraud cases.",
      positionB:"Outdated. It misses group fraud, corporate culture, and powerful executives." },
    { original:"Does crypto make financial crime easier to hide, or easier to trace?",
      question:"Does cryptocurrency make financial crime easier to hide, or easier to trace?",
      background:"Cryptocurrency lets people send money without going through a bank, which makes it attractive for ransomware payments and money laundering. But most cryptocurrencies, including Bitcoin, record every transaction on a public ledger called a blockchain. Investigators using “blockchain analytics” have followed and recovered funds, including much of the ransom paid in the 2021 Colonial Pipeline cyberattack.",
      positionA:"Easier to hide. No bank is watching, and money crosses borders instantly.",
      positionB:"Easier to trace. Every transaction is permanently recorded in public." }
    ]}
  ]},

{ id:"eco", name:"Economics",
  about:"Economics studies how people, businesses, and governments make choices with limited resources, and how those choices add up to markets, industries, and national economies.",
  subfields:[
  { id:"eco-lb", name:"Labor Economics",
    about:"How labor markets work: wages, employment, and working conditions, and how policies and technology affect workers.",
    terms:["labor economics","minimum wage","monopsony","gig economy","independent contractor classification","noncompete agreements","immigration and wages","automation and employment","Card and Krueger"],
    questions:[
    { original:"Will AI replace workers or make them more productive?",
      question:"Will artificial intelligence replace workers, or make them more productive?",
      background:"Earlier technologies, such as tractors and computers, eliminated some jobs but created others, and wages rose over time. Some economists argue AI is different because it can perform mental tasks, like writing and analysis, that used to be safe from automation. Early studies find that AI tools raise productivity most for less-experienced workers, but the long-run effects on employment are still unknown.",
      positionA:"Replace them. AI can do enough tasks that many jobs will disappear.",
      positionB:"Make them more productive. AI will change jobs more than it eliminates them." },
    { original:"Do minimum wage increases cost jobs, or does the evidence say the effects are small?",
      question:"Do minimum wage increases cost jobs, or are the effects on employment small?",
      background:"Basic supply-and-demand reasoning predicts that if labor costs more, employers will hire fewer workers. But a famous 1994 study by David Card and Alan Krueger compared fast-food restaurants in New Jersey, which raised its minimum wage, with those in neighboring Pennsylvania, which didn't, and found no job losses. Research since then has been mixed: moderate increases seem to have small effects, while the effects of large increases are still debated.",
      positionA:"They cost jobs. Employers respond to higher costs by hiring fewer people.",
      positionB:"The effects are small. Workers gain more than they lose." },
    { original:"Is the gig economy flexible opportunity or precarious work?",
      question:"Is gig work, like driving for Uber or delivering for DoorDash, a flexible opportunity or insecure work?",
      background:"Gig workers are usually classified as independent contractors rather than employees, so they don't get protections like a guaranteed minimum wage, health insurance, or unemployment insurance. Companies and many workers value the freedom to work whenever they want. Critics argue that the companies control the work much as employers do, while shifting the risks onto workers.",
      positionA:"Flexible opportunity. Workers choose when and how much to work.",
      positionB:"Insecure work. Workers carry the risks without employee protections." },
    { original:"Do noncompete agreements protect investment in workers, or suppress wages?",
      question:"Do noncompete agreements protect companies' investment in training workers, or hold down wages?",
      background:"A noncompete agreement prevents an employee from working for a competitor for a period after leaving, and some have been used even for sandwich-shop workers. Companies say these agreements protect trade secrets and the money spent on training. Research finds that noncompetes reduce wages by limiting workers' options. The Federal Trade Commission banned most noncompetes in 2024, but a federal court blocked the rule and the FTC later dropped its defense of it. California bans them entirely.",
      positionA:"They protect investment. Companies won't train workers who can carry that knowledge to a rival.",
      positionB:"They hold down wages. Workers who can't leave can't negotiate." },
    { original:"Does immigration lower wages for native workers, or expand the economy for everyone?",
      question:"Does immigration lower wages for native-born workers, or grow the economy for everyone?",
      background:"If more workers compete for the same jobs, wages could fall. But immigrants also spend money, start businesses, and often do different jobs than native-born workers, which can increase the demand for labor. Most studies find small effects on average wages, but economists such as George Borjas and David Card have disagreed sharply about the effects on the lowest-paid workers.",
      positionA:"It lowers wages. More workers competing for jobs means lower pay for some.",
      positionB:"It grows the economy. Immigrants create jobs as well as fill them." }
    ]},
  { id:"eco-mm", name:"Monetary Policy and Macroeconomics",
    about:"How the economy as a whole behaves, including inflation, unemployment, growth, and interest rates, and how central banks and governments try to manage it.",
    terms:["Federal Reserve","dual mandate","central bank independence","inflation","quantitative easing","government debt","interest rate vs. growth rate (r < g)","monetary policy","fiscal policy"],
    questions:[
    { original:"Should central banks target only inflation, or also employment, financial stability, or climate?",
      question:"Should central banks focus only on controlling inflation, or also on jobs, financial stability, and climate change?",
      background:"A central bank, such as the U.S. Federal Reserve, sets interest rates and controls the supply of money. The Fed has a “dual mandate”: stable prices and maximum employment. Others, like the European Central Bank, focus mainly on inflation. Some argue central banks should also guard against financial bubbles or climate risk. Others say more goals mean less accountability and more political pressure.",
      positionA:"Inflation only. A single clear goal is easier to achieve and to hold them accountable for.",
      positionB:"Broader goals. Central banks affect jobs, stability, and climate, so they should consider them." },
    { original:"How independent from elected officials should central banks be?",
      question:"How independent from elected politicians should central banks be?",
      background:"Politicians may want low interest rates before an election to boost the economy, even if that causes inflation later. That is why most central banks are designed to be independent of elected officials. Evidence from the U.S. in the 1970s and from countries like Turkey more recently suggests political pressure leads to higher inflation. But critics ask why unelected officials should make decisions with such large effects on jobs and wealth.",
      positionA:"Fully independent. Politics and money creation don't mix.",
      positionB:"More accountable. Decisions this important should answer to voters." },
    { original:"Was post-pandemic inflation mainly a demand story or a supply story?",
      question:"Was the high inflation after COVID mainly caused by too much spending, or by problems producing and shipping goods?",
      background:"U.S. inflation reached 9.1% in June 2022, the highest in four decades. One explanation focuses on demand: stimulus payments and low interest rates gave people more money to spend than the economy could produce goods for. Another focuses on supply: factory shutdowns, shipping backlogs, and Russia's invasion of Ukraine raised the cost of goods and energy. Most economists think both mattered; the debate is about the balance.",
      positionA:"Demand. Too much money was chasing too few goods.",
      positionB:"Supply. Disrupted production and energy shocks drove prices up." },
    { original:"Does quantitative easing work, and is unwinding it risky?",
      question:"Does it work when central banks create money to buy bonds, and is it risky to reverse?",
      background:"When interest rates are already near zero, central banks can still try to stimulate the economy through “quantitative easing” (QE): creating money to buy government bonds and other assets, which lowers long-term interest rates. The Federal Reserve's holdings grew from under $1 trillion in 2008 to nearly $9 trillion in 2022. Critics argue QE inflated the prices of stocks and homes, which mostly benefits the wealthy, and that shrinking those holdings could disrupt markets.",
      positionA:"It works. It helped prevent depressions in 2008 and 2020.",
      positionB:"It's overrated and risky. The benefits were modest and the side effects are large." },
    { original:"Is high government debt dangerous, or manageable when interest rates are low relative to growth?",
      question:"Is high government debt dangerous, or manageable as long as interest rates stay below the economy's growth rate?",
      background:"U.S. federal debt held by the public is now roughly equal to the size of the entire economy (GDP). Some economists argue that debt is manageable when the interest rate is lower than the economy's growth rate (written “r < g”), because the debt then shrinks relative to the economy over time. Others warn that interest rates rose sharply after 2022, and that in 2024 the government spent more on interest than on national defense.",
      positionA:"Dangerous. Debt eventually forces higher taxes, inflation, or a crisis.",
      positionB:"Manageable. A growing economy can carry a large debt." }
    ]},
  { id:"eco-tr", name:"International Trade",
    about:"Why countries trade, who wins and loses from trade, and how tariffs, sanctions, and government support for industries shape the global economy.",
    terms:["international trade","tariffs","comparative advantage","China shock","reshoring","friend-shoring","industrial policy","CHIPS and Science Act","economic sanctions"],
    questions:[
    { original:"Do tariffs protect domestic industries or mainly raise prices for consumers?",
      question:"Do tariffs protect domestic industries, or mainly raise prices for consumers?",
      background:"A tariff is a tax on imported goods. It makes foreign products more expensive, which can help domestic producers compete. Studies of the 2018–2019 U.S. tariffs on Chinese goods found that most of the cost was passed on to U.S. buyers. Since 2025, the U.S. has raised tariffs far more broadly. Supporters argue they will bring manufacturing back and strengthen the country's bargaining position.",
      positionA:"They protect industry. Tariffs keep jobs and production at home.",
      positionB:"They raise prices. Consumers and businesses that buy imports pay the cost." },
    { original:"Is reshoring or “friend-shoring” worth the efficiency cost?",
      question:"Is moving production back home, or to friendly countries, worth the higher cost?",
      background:"For decades, companies moved production to wherever it was cheapest, often China. “Reshoring” brings production back home; “friend-shoring” moves it to allied countries. The COVID pandemic and tensions with China exposed the risks of depending on one country for medicines, computer chips, and other critical goods. But producing in higher-cost countries means higher prices.",
      positionA:"Worth it. Security and reliability are worth paying for.",
      positionB:"Not worth it. Consumers pay the cost, and supply can be spread out without it." },
    { original:"Did trade with China (the “China shock”) do more harm to U.S. workers than economists expected?",
      question:"Did trade with China hurt American workers more than economists expected?",
      background:"Economists long argued that free trade benefits nations overall, and that workers who lose jobs to imports would find new ones. But research by David Autor, David Dorn, and Gordon Hanson, known as the “China shock” studies, found that U.S. communities exposed to Chinese import competition after 2001 suffered lasting job losses, lower wages, and social problems for more than a decade. Other researchers note that consumers gained from cheaper goods and that automation also eliminated manufacturing jobs.",
      positionA:"Yes. The damage was deeper and longer-lasting than economists predicted.",
      positionB:"It has been overstated. Consumers benefited, and automation cost more jobs." },
    { original:"Should industrial policy (subsidies for chips and clean energy) be revived, or does government pick losers?",
      question:"Should governments pay to support specific industries, like computer chips and clean energy, or does that waste money on the wrong bets?",
      background:"“Industrial policy” means government support for particular industries. The 2022 CHIPS Act included about $52 billion for U.S. semiconductor manufacturing and research, and the Inflation Reduction Act offered large tax credits for clean energy, some of which have since been cut back. Supporters point to the success of South Korea and Taiwan. Critics point to failures like Solyndra, a solar company that went bankrupt after receiving a $535 million federal loan guarantee.",
      positionA:"Support them. Some industries are too important to leave to the market.",
      positionB:"Avoid it. Governments are bad at picking winners and good at funding losers." },
    { original:"Do sanctions change governments' behavior, or mostly hurt civilians?",
      question:"Do economic sanctions change governments' behavior, or mainly hurt ordinary people?",
      background:"Sanctions restrict trade or financial dealings with a country, company, or person. They have been used against countries like Russia, Iran, and North Korea. Research suggests sanctions rarely achieve major goals, such as forcing a government to change its policies. Supporters argue they still raise the cost of aggression. Critics note they cause shortages that hit ordinary citizens hardest.",
      positionA:"They work. They impose real costs and limit dangerous behavior.",
      positionB:"They mostly hurt civilians. Governments adapt while ordinary people suffer." }
    ]},
  { id:"eco-be", name:"Behavioral Economics",
    about:"How real people make economic decisions, including the predictable ways they depart from the “perfectly rational” model, and how policy can use those insights.",
    terms:["behavioral economics","nudge","choice architecture","default effect","replication crisis","bounded rationality","loss aversion","Daniel Kahneman","Richard Thaler"],
    questions:[
    { original:"Do nudges produce durable behavior change, or are their effects overstated?",
      question:"Do small changes in how choices are presented, known as “nudges,” produce lasting changes in behavior, or are their effects exaggerated?",
      background:"A “nudge,” a term popularized by Richard Thaler and Cass Sunstein, changes how choices are presented without forbidding any option: for example, putting fruit at eye level in a cafeteria or sending reminder texts. Early studies reported impressive effects. But a 2022 review argued that once studies with no results, which often go unpublished, are taken into account, the average effect may be close to zero.",
      positionA:"Lasting. Small design changes can reliably change behavior.",
      positionB:"Exaggerated. Once unpublished results are counted, the effects shrink." },
    { original:"Should governments use behavioral insights at all, or is that manipulation?",
      question:"Should governments use psychological research to influence citizens' choices, or is that manipulation?",
      background:"Governments, starting with the U.K., created “nudge units” to apply behavioral research. For example, telling people who were late on taxes that most of their neighbors pay on time increased payments. Supporters say every choice has to be presented somehow, so it might as well be designed well. Critics argue it influences people without their awareness, and that the government decides what is “good” for them.",
      positionA:"Use it. If it helps people reach their own goals, it is good policy.",
      positionB:"It's manipulation. Governments shouldn't use psychological techniques on citizens." },
    { original:"How many famous behavioral findings survive replication?",
      question:"How many famous findings about human behavior hold up when other researchers repeat the studies?",
      background:"Science relies on “replication”: other researchers repeating a study to see whether they get the same result. In the 2010s, attempts to repeat famous psychology studies found that many did not hold up, a problem known as the “replication crisis.” Some well-known behavioral findings, such as “ego depletion” (the idea that willpower runs down like a battery), largely failed. Others, such as loss aversion, have held up better, though even that is debated.",
      positionA:"Many fail. The field needs to be much more skeptical of its own findings.",
      positionB:"The core findings hold. The failures are mostly in weaker side studies." },
    { original:"Are people irrational, or rational given their limited information and attention?",
      question:"Are people irrational, or are they making reasonable choices given their limited information and attention?",
      background:"Behavioral economists have documented many “biases”: people procrastinate, overvalue what they already own, and are swayed by how options are described. Some conclude that people are systematically irrational. Others, building on Herbert Simon's idea of “bounded rationality” and Gerd Gigerenzer's work on rules of thumb, argue that these mental shortcuts are sensible strategies when information and attention are limited.",
      positionA:"Irrational. People make predictable mistakes that hurt them.",
      positionB:"Reasonably rational. Shortcuts are smart when time and information are limited." },
    { original:"Do default options (auto-enrollment) help people, or just exploit inertia?",
      question:"When employers automatically enroll workers in retirement savings plans, does that help them, or exploit their tendency to leave things as they are?",
      background:"When workers have to sign up for a retirement plan, many never do. When they are enrolled automatically and have to opt out, participation jumps; one well-known study found it rose from under 40% to over 85%. The SECURE 2.0 Act of 2022 requires automatic enrollment for most new retirement plans. Critics note that many people then stay at the low default savings rate and never make an active choice.",
      positionA:"It helps. Most people want to save, and the default helps them follow through.",
      positionB:"It exploits inertia. People end up in plans they never really chose." }
    ]},
  { id:"eco-io", name:"Industrial Organization",
    about:"How industries are structured, including how many firms compete and how they set prices, and when the government should step in to protect competition, an area of law known as antitrust.",
    terms:["industrial organization","antitrust","market power","network effects","consumer welfare standard","merger review","algorithmic pricing","tacit collusion","self-preferencing","Digital Markets Act"],
    questions:[
    { original:"Are big tech platforms a natural result of competition, or a competition problem?",
      question:"Did big technology companies grow by beating competitors fairly, or is their size itself a problem for competition?",
      background:"Platforms like Google Search and Amazon's marketplace become more useful the more people use them, an effect called “network effects.” That tends to produce one dominant company. In 2024, a federal court ruled that Google had illegally maintained a monopoly in online search. Defenders say these companies won by building better products, many of them free.",
      positionA:"Fair competition. They won because users prefer their products.",
      positionB:"A competition problem. Once dominant, they keep new rivals from emerging." },
    { original:"Should antitrust focus only on consumer prices, or also on market power and labor?",
      question:"Should competition law focus only on whether consumers pay higher prices, or also on corporate power and its effects on workers?",
      background:"Since the 1970s, U.S. antitrust law has mostly followed the “consumer welfare standard”: a merger or business practice is harmful mainly if it raises prices or lowers quality for consumers. A newer group of scholars, sometimes called the “New Brandeis” movement, argues that this standard misses harms when products are free, when companies hold down workers' wages, or when concentrated economic power influences politics.",
      positionA:"Consumer prices. A clear standard keeps the law predictable.",
      positionB:"Broader power. Size can harm workers, suppliers, and democracy even when prices are low." },
    { original:"Do mergers create efficiencies, or mainly reduce competition?",
      question:"When companies merge, do they become more efficient, or mainly reduce competition?",
      background:"Merging companies usually promise “synergies,” meaning lower costs from combining their operations. But fewer competitors can also mean higher prices. Studies of hospital and airline mergers often find that prices rose afterward. Other studies find that many mergers fail to deliver the promised savings at all, in which case the companies' own shareholders lose too.",
      positionA:"More efficient. Mergers often reduce costs and improve products.",
      positionB:"Less competition. The main result is usually higher prices." },
    { original:"Is algorithmic pricing a route to tacit collusion?",
      question:"Can pricing software let competing companies keep prices high without ever talking to each other?",
      background:"Many companies now set prices with software. If competing landlords all use the same pricing software, it may recommend similarly high rents to all of them. In 2024 the U.S. Justice Department sued RealPage, a rent-pricing software company, over exactly this concern. Explicit agreements to fix prices are illegal, but the law is unclear when the coordination happens through shared software rather than an agreement.",
      positionA:"Yes. Shared algorithms can produce price-fixing without any agreement.",
      positionB:"Overstated. Algorithms also help companies undercut each other faster." },
    { original:"Should platforms be allowed to compete against the sellers who use them?",
      question:"Should a platform like Amazon be allowed to sell its own products in competition with the independent sellers who use its platform?",
      background:"Amazon runs a marketplace where independent sellers list products, and it also sells its own products, such as the Amazon Basics line. Critics argue Amazon can use sellers' sales data to copy successful products and then rank its own versions higher. The European Union's Digital Markets Act restricts this kind of “self-preferencing.” Defenders note that store brands are common: supermarkets sell their own brands next to name brands.",
      positionA:"Allow it. Store brands are normal and give consumers cheaper options.",
      positionB:"Restrict it. Owning the marketplace and competing in it is an unfair advantage." }
    ]}
  ]},

{ id:"fin", name:"Finance",
  about:"Finance studies how people and organizations raise, invest, and manage money, how financial markets set prices, and how the financial system can be kept stable.",
  subfields:[
  { id:"fin-ap", name:"Asset Pricing and Investments",
    about:"How financial assets like stocks and bonds are valued, why some investments earn more than others, and whether investors can consistently beat the market.",
    terms:["efficient market hypothesis","passive investing","index funds","factor investing","value premium","momentum","market anomalies","common ownership","Eugene Fama","Robert Shiller"],
    questions:[
    { original:"Is passive investing making markets less efficient?",
      question:"Is the growth of index funds making stock markets worse at pricing companies accurately?",
      background:"An index fund buys every stock in an index, such as the S&P 500, instead of choosing particular stocks. These “passive” funds charge low fees, and they now hold more U.S. fund money than “active” funds, whose managers research companies and pick stocks. But markets rely on active investors' research to set accurate prices. If too few investors do that research, prices could drift away from what companies are really worth.",
      positionA:"Yes. Fewer people researching companies means less accurate prices.",
      positionB:"No. The remaining active investors are enough to keep prices accurate." },
    { original:"Are markets efficient, or do anomalies and bubbles show they aren't?",
      question:"Do stock prices accurately reflect all available information, or do bubbles and crashes prove that markets get it wrong?",
      background:"The “efficient market hypothesis,” associated with Eugene Fama, says prices already reflect all available information, so no one can consistently beat the market. But in the dot-com bubble of the late 1990s and the housing bubble before 2008, prices rose far above any reasonable value. Robert Shiller, who shared the 2013 Nobel Prize in economics with Fama, argues that psychology drives such bubbles.",
      positionA:"Efficient. Consistently beating the market is nearly impossible.",
      positionB:"Not efficient. Bubbles and crashes show prices can be badly wrong." },
    { original:"Do most “factors” (value, momentum, etc.) survive out of sample, or are they data mining?",
      question:"Are the patterns researchers have found in stock returns real, or the result of searching through data until something turns up?",
      background:"Researchers have identified “factors,” characteristics that seem to predict higher returns. Examples include “value” (stocks that are cheap relative to the company's earnings or assets) and “momentum” (stocks that have recently risen). Hundreds of factors have been published. But if you test enough patterns, some will look meaningful by pure chance. Studies find that many factors weaken or disappear after they are published.",
      positionA:"Real. Some factors reflect genuine risks or lasting patterns in investor behavior.",
      positionB:"Mostly data mining. Test enough patterns and some will look good by chance." },
    { original:"Is the value premium dead?",
      question:"Is the long-standing advantage of investing in “cheap” stocks gone for good?",
      background:"For decades, “value” stocks, those priced low relative to the company's earnings or accounting value, earned higher returns than “growth” stocks. It was one of the best-known patterns in finance. But from about 2007 to 2020, value stocks badly lagged as technology companies soared. Some argue the advantage disappeared once everyone knew about it, or that accounting numbers no longer capture what modern companies are worth. Others say it simply goes through long cycles.",
      positionA:"Gone for good. The economy has changed, and so has what “cheap” means.",
      positionB:"Just dormant. The value advantage has always come and gone." },
    { original:"Does common ownership by large index funds reduce competition among companies?",
      question:"When the same few fund companies own large stakes in every competitor in an industry, does that reduce competition?",
      background:"Vanguard, BlackRock, and State Street are together often the largest shareholders in most large U.S. companies, including direct competitors such as the major airlines. Some research suggests that when competitors share the same owners, they have less reason to compete hard on price. Other researchers dispute those findings, noting that index funds rarely get involved in companies' business strategy.",
      positionA:"Yes. Shared owners gain nothing from companies competing hard against each other.",
      positionB:"No. Index funds are hands-off owners and don't influence pricing." }
    ]},
  { id:"fin-cf", name:"Corporate Finance",
    about:"How companies decide which projects to invest in, how to pay for them (by borrowing or selling shares), and what to do with their profits.",
    terms:["corporate finance","stock buybacks","capital structure","Modigliani-Miller theorem","private equity","leveraged buyout","shareholder value","initial public offering (IPO)","IPO underpricing"],
    questions:[
    { original:"Are stock buybacks good capital allocation, or short-termism?",
      question:"When companies buy back their own stock, is that a smart use of money or short-term thinking?",
      background:"In a “stock buyback,” a company uses its cash to purchase its own shares. That reduces the number of shares and usually raises the price of each remaining one. Large U.S. companies have recently spent close to $1 trillion a year on buybacks. Supporters say returning cash a company can't use well is efficient. Critics say buybacks boost executives' stock-based pay at the expense of investment and wages. Since 2023, the U.S. has charged a 1% tax on buybacks.",
      positionA:"A smart use of money. Returning unneeded cash lets investors put it to work elsewhere.",
      positionB:"Short-term thinking. That money could be invested in the business and its workers." },
    { original:"Does capital structure matter, or is it mostly irrelevant (Modigliani-Miller)?",
      question:"Does it matter whether a company pays for itself with borrowed money or by selling shares?",
      background:"In 1958, Franco Modigliani and Merton Miller showed that under idealized conditions (no taxes, no bankruptcy costs, everyone has the same information) a company's value doesn't depend on how it is financed. Real markets aren't ideal. Interest on debt is tax-deductible, which favors borrowing, but too much debt raises the risk of bankruptcy. The question is how much these real-world factors matter.",
      positionA:"It matters a lot. The right mix of borrowing and shares creates real value.",
      positionB:"It's mostly irrelevant. What the business does matters far more than how it's financed." },
    { original:"Do private equity buyouts improve companies, or strip them?",
      question:"Do private equity buyouts improve companies, or strip them of value?",
      background:"Private equity firms buy companies, often with large amounts of borrowed money (a “leveraged buyout”), try to improve them, and sell them several years later. Research finds that some buyouts do improve productivity. But some well-known companies, like Toys “R” Us, went bankrupt after buyouts loaded them with debt, and a study of nursing homes bought by private equity firms found worse outcomes for patients.",
      positionA:"Improve them. Owners with a lot at stake push for real changes.",
      positionB:"Strip them. Heavy debt and fees benefit the buyers at everyone else's expense." },
    { original:"Should firms maximize shareholder value or a broader set of goals?",
      question:"Should companies focus on maximizing returns to their shareholders, or pursue a broader set of goals?",
      background:"In 1970, the economist Milton Friedman argued that a business's social responsibility is to increase its profits. In 2019, the Business Roundtable, a group of nearly 200 CEOs of large companies, declared that companies should serve customers, employees, suppliers, and communities as well as shareholders. Critics of the broader view argue that a company trying to serve everyone ends up with managers who answer to no one.",
      positionA:"Shareholder returns. A single clear goal keeps managers accountable.",
      positionB:"Broader goals. Companies should serve everyone they affect." },
    { original:"Are IPOs underpriced, and why do so many firms now stay private longer?",
      question:"Is the traditional process for companies to start selling shares to the public working well, or is it broken?",
      background:"When a company first sells shares to the public, in an “initial public offering” (IPO), the share price often jumps on the first day of trading, by about 15–20% on average in the U.S. That suggests companies sell their shares for less than investors are willing to pay. Meanwhile, the number of U.S. public companies has fallen by roughly half since the late 1990s, as companies stay private longer and raise money from private investors instead.",
      positionA:"It works. The first-day jump is fair payment to investors who take a risk on an unknown company.",
      positionB:"It's broken. Banks underprice shares to reward favored clients, and costs and regulations push companies to stay private." }
    ]},
  { id:"fin-bk", name:"Banking and Financial Institutions",
    about:"How banks and other financial institutions work, why they sometimes fail, and how regulation tries to keep the financial system safe.",
    terms:["bank regulation","capital requirements","Basel III","too big to fail","Dodd-Frank Act","private credit","shadow banking","Silicon Valley Bank failure","central bank digital currency (CBDC)"],
    questions:[
    { original:"Is risk moving out of regulated banks into private credit and other less-regulated areas?",
      question:"Is risk moving out of closely regulated banks and into less-regulated lenders?",
      background:"After the 2008 financial crisis, banks faced stricter rules. Since then, lending has grown rapidly elsewhere, especially “private credit,” in which investment funds lend directly to companies. Private credit has grown to roughly $1.5–2 trillion worldwide. Supporters say it moves risk to investors who chose to take it, instead of to bank depositors. Regulators worry that it is hard to see into and could cause problems in a downturn.",
      positionA:"Yes, and it's a growing danger that regulators can't see clearly.",
      positionB:"It's a healthy shift. Risk now sits with investors who chose to take it." },
    { original:"Are banks still “too big to fail”?",
      question:"Are the largest banks still “too big to fail”?",
      background:"In 2008, governments rescued major banks because letting them fail could have brought down the whole financial system. This is the “too big to fail” problem: if banks expect to be rescued, they may take bigger risks. The 2010 Dodd-Frank Act required banks to hold more of their own money and to prepare “living wills,” plans for an orderly failure. In 2023, regulators arranged for JPMorgan Chase, already the largest U.S. bank, to buy the failed First Republic Bank.",
      positionA:"Still too big to fail. Governments would rescue them again.",
      positionB:"Largely fixed. Reforms made big banks much safer." },
    { original:"Do higher capital requirements make banks safer, or just reduce lending?",
      question:"Do rules requiring banks to fund themselves with more of their own money make them safer, or just reduce lending?",
      background:"A bank's “capital” is its own money, mainly from shareholders, as opposed to deposits and borrowed money. More capital means a bank can absorb larger losses without failing. Banks argue that requiring more capital makes lending more expensive and reduces credit for businesses and households. Economists such as Anat Admati argue that much higher capital levels would cost the economy very little.",
      positionA:"Safer. More capital is the best protection against crises.",
      positionB:"Less lending. High requirements push credit away from the economy." },
    { original:"Did the 2023 regional bank failures show a failure of regulation or of management?",
      question:"Were the 2023 bank failures, including Silicon Valley Bank, mainly the fault of regulators or of the banks' own managers?",
      background:"In March 2023, Silicon Valley Bank failed after customers tried to withdraw $42 billion in a single day. The bank had invested heavily in long-term bonds that lost value when interest rates rose, and most of its deposits were above the $250,000 limit covered by government insurance. Its managers ignored the risk from rising rates. But the Federal Reserve's own review found that its supervisors had identified problems and didn't act forcefully, and some rules had been loosened in 2018.",
      positionA:"Regulators. Supervisors saw the problems and failed to act.",
      positionB:"Management. The bank took obvious risks and ignored warnings." },
    { original:"Should central banks issue digital currencies, and what would that mean for banks?",
      question:"Should central banks issue their own digital currencies, and what would that mean for banks?",
      background:"A “central bank digital currency” (CBDC) would be digital money issued directly by a central bank, something like digital cash. China has tested a digital yuan, and the European Central Bank is preparing a digital euro. Supporters point to faster, cheaper payments. Critics raise privacy concerns and worry that in a crisis people would pull their money out of banks and into the CBDC. A 2025 U.S. executive order prohibited federal agencies from creating one.",
      positionA:"Issue them. Public digital money would be safer and more efficient.",
      positionB:"Don't. They threaten privacy and could drain deposits from banks." }
    ]},
  { id:"fin-bf", name:"Behavioral Finance",
    about:"How psychology affects investors' decisions and market prices, and whether investors need protection from their own mistakes.",
    terms:["behavioral finance","overconfidence bias","meme stocks","GameStop short squeeze","retail investors","gamification of trading","overreaction and underreaction","investor protection","Barber and Odean"],
    questions:[
    { original:"Do retail-trading apps democratize investing, or encourage gambling?",
      question:"Do free stock-trading apps open investing up to everyone, or encourage gambling?",
      background:"Apps like Robinhood made trading free and easy from a phone, attracting millions of young investors. Critics say features like confetti animations and frequent notifications turn trading into a game, and options trading, a form of high-risk bet, grew quickly among new investors. In 2024, Robinhood paid $7.5 million to settle Massachusetts charges that it had “gamified” investing. Supporters say ordinary people now have access that used to be limited to the wealthy.",
      positionA:"Open it up. Anyone can now build wealth in the market.",
      positionB:"Encourage gambling. The design rewards frequent, risky trading." },
    { original:"Are meme-stock episodes irrational bubbles or a new form of coordination?",
      question:"Were “meme stock” episodes like GameStop irrational bubbles, or a new way for investors to act together?",
      background:"In January 2021, individual investors organizing on the Reddit forum r/wallstreetbets bought shares of GameStop, a struggling video-game retailer. Its stock rose from under $20 to over $400 within weeks, causing large losses for hedge funds that had bet the price would fall. Some see a bubble driven by hype. Others see ordinary investors coordinating to take on large institutions.",
      positionA:"Irrational bubbles. The prices had nothing to do with the company's value.",
      positionB:"A new way to act together. Small investors used social media to act as a group." },
    { original:"Do investors systematically overreact or underreact to news?",
      question:"Do investors tend to overreact to news, or underreact to it?",
      background:"If investors overreact, stocks that drop sharply on bad news should later partly recover. Research by Werner De Bondt and Richard Thaler found that stocks that had done worst over several years went on to beat those that had done best. But other research finds underreaction: after a company reports surprising earnings, its stock price keeps drifting in the same direction for weeks. Both patterns may appear under different circumstances.",
      positionA:"Overreact. Investors get carried away by dramatic news.",
      positionB:"Underreact. Investors are slow to update their views." },
    { original:"Does overconfidence explain excessive trading and poor returns?",
      question:"Does overconfidence explain why some investors trade too much and earn poor returns?",
      background:"Brad Barber and Terrance Odean studied tens of thousands of household brokerage accounts and found that the most active traders earned the lowest returns, largely because of trading costs. Men traded 45% more than women and earned lower returns. The researchers attributed this to overconfidence. Others argue that people trade for many other reasons, such as entertainment, needing cash, or acting on limited information.",
      positionA:"Yes. Investors think they know more than they do.",
      positionB:"Only partly. People trade for many reasons besides overconfidence." },
    { original:"Should regulators protect investors from their own biases?",
      question:"Should regulators protect investors from their own mistakes?",
      background:"Securities regulators have traditionally focused on disclosure: companies must provide accurate information, and investors are then free to choose. Behavioral finance suggests disclosure alone may not help if people predictably misjudge risk. Some propose limits on risky products for inexperienced investors. Others argue adults should be free to make their own choices and learn from their losses.",
      positionA:"Yes. When mistakes are predictable, rules should prevent them.",
      positionB:"No. Adults should be free to take risks with their own money." }
    ]},
  { id:"fin-ft", name:"Fintech and Digital Assets",
    about:"How new technology, including apps, algorithms, and blockchains, is changing payments, lending, and investing, and how regulators should respond.",
    terms:["fintech","stablecoins","GENIUS Act","cryptocurrency valuation","decentralized finance (DeFi)","smart contracts","algorithmic lending","fair lending","tokenization of real-world assets"],
    questions:[
    { original:"Are stablecoins a real payments innovation or a new source of instability?",
      question:"Are stablecoins a real improvement in how payments work, or a new source of financial instability?",
      background:"A “stablecoin” is a cryptocurrency designed to hold a steady value, usually $1, by keeping reserves such as cash and short-term government bonds. Stablecoins allow fast, low-cost transfers worldwide at any hour. But if holders doubt the reserves, they may all rush to cash out, much like a run on a bank. TerraUSD, a stablecoin without real reserves, collapsed in 2022, wiping out tens of billions of dollars. The U.S. GENIUS Act of 2025 created the first federal rules for stablecoins.",
      positionA:"A real improvement. Payments become faster and cheaper for everyone.",
      positionB:"A new instability. Stablecoins can suffer runs just like unregulated banks." },
    { original:"Does crypto have fundamental value, or only speculative value?",
      question:"Does cryptocurrency have real underlying value, or is it worth only what the next buyer will pay?",
      background:"A stock has value because it represents a share of a company's future profits, and a bond pays interest. Bitcoin pays neither. Supporters argue its value comes from its fixed supply (there will only ever be 21 million bitcoins), its independence from governments, and its usefulness for transfers, making it a kind of “digital gold.” Skeptics argue its price depends only on people expecting others to buy it later.",
      positionA:"Real value. A fixed supply and independence from governments are worth something.",
      positionB:"Only speculative. It produces no income, so its price rests on belief alone." },
    { original:"Does fintech lending expand credit access, or recreate discrimination through algorithms?",
      question:"Does lending decided by computer algorithms give more people access to credit, or reproduce discrimination?",
