      background:"Fintech lenders use algorithms and nontraditional data, such as rent payments or education, to decide who gets loans. This can help people with little credit history. A 2022 study of U.S. mortgages found that algorithmic lenders charged Black and Latino borrowers less extra interest than face-to-face lenders did, but did not eliminate the gap. Critics warn that algorithms can learn discrimination from historical data even without being told anyone's race.",
      positionA:"More access. Algorithms can judge people more fairly than human loan officers.",
      positionB:"Reproduced discrimination. Algorithms learn the biases built into past data." },
    { original:"Should DeFi be regulated like banks or left alone?",
      question:"Should financial services run by software on blockchains be regulated like banks, or left alone?",
      background:"“Decentralized finance” (DeFi) uses programs on blockchains, called “smart contracts,” to offer lending, trading, and other services without a bank or company in the middle. Supporters say it is open to anyone and cuts out middlemen. But hacks and scams have cost users billions of dollars, and often there is no one to hold responsible. Regulating it is difficult when there is no company to regulate.",
      positionA:"Regulate it like banks. The same activity should face the same rules.",
      positionB:"Leave it alone. Heavy rules would kill an innovation that doesn't fit the old model." },
    { original:"Will tokenizing real-world assets transform markets or remain marginal?",
      question:"Will recording ownership of real assets, like buildings, bonds, or art, on blockchains transform markets?",
      background:"“Tokenization” means representing ownership of an asset as a digital token on a blockchain. This could let people buy small fractions of expensive assets and trade them instantly at any hour, instead of waiting days for a trade to settle. BlackRock, the world's largest asset manager, launched a tokenized fund in 2024. Skeptics note that existing systems already work, and that legal ownership still depends on courts and official records, not tokens.",
      positionA:"Transform them. Markets will become faster, cheaper, and more accessible.",
      positionB:"Remain marginal. It solves problems existing systems already handle." }
    ]}
  ]},

{ id:"mgt", name:"Management",
  about:"Management studies how organizations are led and run: how they set strategy, organize and motivate people, produce goods and services, and are held accountable.",
  subfields:[
  { id:"mgt-st", name:"Strategy",
    about:"How companies decide where to compete and how to win, and why some companies outperform their rivals for long periods.",
    terms:["competitive advantage","sustainable competitive advantage","Porter's Five Forces","platform strategy","conglomerate discount","make-or-buy decision","business ecosystems","first-mover advantage"],
    questions:[
    { original:"Does competitive advantage still last, or is all advantage temporary now?",
      question:"Can a company's competitive advantage still last for decades, or is every advantage temporary now?",
      background:"A “competitive advantage” is whatever lets a company consistently outperform its rivals: lower costs, a stronger brand, a unique product. Some companies, like Coca-Cola, have held their positions for over a century. But in 2013 the researcher Rita McGrath argued that in fast-changing industries, advantages now last only briefly, so companies must keep building new ones. BlackBerry and Nokia both lost dominant positions in phones within a few years.",
      positionA:"Advantages can still last. Strong brands and scale are hard to copy.",
      positionB:"Every advantage is temporary. Companies must keep reinventing themselves." },
    { original:"Is Porter's Five Forces still useful in a platform economy?",
      question:"Is a classic framework for analyzing how profitable an industry can be still useful now that so many businesses are digital platforms?",
      background:"In 1979, Michael Porter proposed that an industry's profitability depends on five forces: rivalry among existing competitors, the threat of new competitors entering, the threat of substitute products, the bargaining power of buyers, and the bargaining power of suppliers. It remains one of the most widely taught business frameworks. Critics argue it was designed for traditional industries and fits poorly with platforms like Uber, which connect buyers and sellers rather than making a product themselves.",
      positionA:"Still useful. These five forces still determine profits.",
      positionB:"Outdated. Platforms work by different rules." },
    { original:"Do diversified conglomerates create value or destroy it?",
      question:"Do companies that run many unrelated businesses create value, or destroy it?",
      background:"A conglomerate owns businesses in unrelated industries. General Electric once made jet engines, light bulbs, and medical scanners, and ran a large lending business. Research has often found a “conglomerate discount”: investors value diversified companies at less than the sum of their parts. GE split itself into three companies by 2024. Yet Berkshire Hathaway, which owns insurance companies, a railroad, and a candy maker, among many others, has been highly successful.",
      positionA:"Create value. Strong management and shared resources can make the whole worth more.",
      positionB:"Destroy value. Companies do best when they focus on what they know." },
    { original:"Should firms build capabilities in-house or rely on partners and ecosystems?",
      question:"Should companies build their own capabilities in-house, or rely on partners and outside suppliers?",
      background:"Every company decides what to do itself and what to buy from others, known as the “make-or-buy” decision. Apple designs its own chips but relies on TSMC in Taiwan to manufacture them. Relying on partners can be cheaper and faster, but it means depending on others for critical work. In recent years, many companies have brought more work in-house; Tesla, for example, began making some of its own batteries.",
      positionA:"Build in-house. Controlling key capabilities is a lasting advantage.",
      positionB:"Rely on partners. No company can be the best at everything." },
    { original:"Is first-mover advantage real, or do fast followers usually win?",
      question:"Do the first companies into a new market usually win, or do the companies that follow them win instead?",
      background:"“First-mover advantage” is the idea that being first into a market lets a company build its brand, capture customers, and set the standards. Amazon was an early online bookseller and became dominant. But Google wasn't the first search engine, Facebook wasn't the first social network, and the iPhone wasn't the first smartphone. Companies that follow can learn from the pioneer's mistakes.",
      positionA:"First movers win. Being early builds a lead others can't catch.",
      positionB:"Fast followers win. They learn from the pioneers' mistakes." }
    ]},
  { id:"mgt-ob", name:"Organizational Behavior and Human Resources",
    about:"How people behave at work, including motivation, teamwork, culture, and leadership, and how organizations hire, pay, and manage their employees.",
    terms:["organizational behavior","human resource management","remote and hybrid work","diversity, equity, and inclusion (DEI)","employee monitoring","pay transparency laws","four-day workweek","organizational culture"],
    questions:[
    { original:"Does remote and hybrid work help or hurt performance and culture?",
      question:"Does remote and hybrid work help or hurt performance and workplace culture?",
      background:"The pandemic made remote work common. A large study led by Stanford economist Nicholas Bloom, published in 2024, found that hybrid work (some days at home) did not reduce productivity or promotions and sharply reduced the number of people quitting. But many executives argue that new ideas, mentoring, and culture depend on in-person contact, and companies like Amazon now require employees in the office five days a week.",
      positionA:"It helps. Flexibility keeps good employees without hurting results.",
      positionB:"It hurts. Culture and learning depend on being together in person." },
    { original:"Do diversity programs improve performance, and how should that be measured?",
      question:"Do workplace diversity programs improve performance, and how should that be measured?",
      background:"Many companies created programs to increase diversity in hiring and promotion. Reports from consulting firms such as McKinsey link diverse leadership teams to higher profits, but academic researchers have had trouble reproducing those findings. Research by Frank Dobbin and Alexandra Kalev found that some approaches, like mandatory diversity training, can backfire, while mentoring programs work better. Many U.S. companies scaled back these programs in 2025 under political and legal pressure.",
      positionA:"They improve performance. Diverse teams make better decisions.",
      positionB:"The evidence is weak. Many programs don't deliver what they promise." },
    { original:"Is employee monitoring a productivity tool or a trust killer?",
      question:"Is monitoring employees' computer activity a productivity tool, or does it destroy trust?",
      background:"Software can now record employees' keystrokes, take screenshots, log the websites they visit, and even use their webcams. Use of these tools grew quickly with remote work. Employers say they need to know that work is getting done. Studies suggest heavy monitoring can increase stress and lead employees to focus on looking busy rather than on doing valuable work.",
      positionA:"A productivity tool. Employers have a right to know how work time is spent.",
      positionB:"A trust killer. Surveillance tells employees they aren't trusted." },
    { original:"Do pay transparency laws reduce pay gaps, or create new conflicts?",
      question:"Do laws requiring companies to share pay information reduce unfair pay gaps, or create new conflicts?",
      background:"States including Colorado, California, and New York now require employers to list salary ranges in job postings. Supporters argue that secrecy about pay lets gaps, including gaps by gender and race, continue. Research finds that transparency does narrow gaps, but sometimes because higher earners' pay grows more slowly rather than because lower earners catch up, and that it can cause resentment among coworkers.",
      positionA:"It reduces gaps. You can't fix what you can't see.",
      positionB:"It creates conflict. Knowing coworkers' pay breeds resentment and slows raises." },
    { original:"Are four-day workweeks sustainable?",
      question:"Can companies keep a four-day workweek without losing productivity?",
      background:"In 2022, 61 U.K. companies tested a four-day week with no cut in pay. Most kept the schedule after the trial ended, reporting similar revenue and less burnout among employees. Critics note that the companies volunteered for the trial, so they likely expected it to work, and that the approach is harder to apply in jobs like nursing or retail, where someone has to be present.",
      positionA:"Sustainable. Rested people get the same work done in less time.",
      positionB:"Not broadly sustainable. It works in some offices but not in most jobs." }
    ]},
  { id:"mgt-en", name:"Entrepreneurship",
    about:"How new businesses are started, funded, and grown, and why some founders succeed while others don't.",
    terms:["entrepreneurship","lean startup","minimum viable product","business planning","venture capital","startup funding","founder bias in venture capital","barriers to entry"],
    questions:[
    { original:"Do startups succeed more through planning or through fast experimentation?",
      question:"Do startups succeed more through careful planning, or through fast experimentation?",
      background:"Founders traditionally wrote detailed business plans before launching. The “lean startup” approach, popularized by Eric Ries in 2011, instead recommends launching a simple early version of a product quickly (a “minimum viable product”), learning from customers, and adjusting. Research shows planning helps some new ventures, but many successful companies ended up doing something very different from their original plan.",
      positionA:"Planning. Thinking carefully first avoids costly mistakes.",
      positionB:"Experimentation. You can't plan around what you don't yet know about customers." },
    { original:"Is venture capital a good model for funding innovation, or does it distort which ideas get funded?",
      question:"Is venture capital a good way to fund new ideas, or does it distort which ideas get funded?",
      background:"Venture capital (VC) firms invest in young companies in exchange for part ownership. Because most startups fail, VC firms look for the few that might return 100 times their investment. Venture capital helped fund Google, Apple, and Moderna. But critics argue it favors software and fast-growing ideas, neglects slower-growing businesses, and is concentrated in a few places like Silicon Valley.",
      positionA:"A good model. It funds risky ideas no bank would touch.",
      positionB:"It distorts. Only ideas that could become enormous get funded." },
    { original:"Are entrepreneurs born or made?",
      question:"Are entrepreneurs born, or made?",
      background:"Some research comparing twins suggests that genetics partly influence whether people become entrepreneurs. Other studies emphasize family background, access to money, education, and social connections; for example, children from high-income families are far more likely to become inventors. Entrepreneurship courses and programs assume the necessary skills can be taught.",
      positionA:"Born. Personality traits like comfort with risk matter most.",
      positionB:"Made. Skills, opportunities, and resources matter most." },
    { original:"Does AI lower the barrier to starting a business, or make it easier to copy?",
      question:"Does artificial intelligence make it easier to start a business, or easier for others to copy yours?",
      background:"AI tools can now write code, design logos, draft marketing copy, and answer customer questions, so one person can do work that once required a team. That lowers the cost of starting a business. But it also lowers the cost for competitors to copy a product, which could make it harder to build a business that lasts.",
      positionA:"Easier to start. AI puts powerful tools in every founder's hands.",
      positionB:"Easier to copy. When everyone can build quickly, nothing stays unique." },
    { original:"Why do founders with similar ideas get such different funding outcomes, and how much of that is bias?",
      question:"Why do founders with similar ideas get very different amounts of funding, and how much of that is bias?",
      background:"In recent years, startups founded only by women have received only about 2% of U.S. venture capital. Research by Dana Kanze and colleagues found that investors tended to ask male founders about potential gains and female founders about potential losses, and that founders who got more loss-focused questions raised less money. Others argue that differences in funding mostly reflect differences in industry, experience, and connections.",
      positionA:"Mostly bias. Investors favor founders who look like them.",
      positionB:"Mostly other factors. Experience, industry, and connections explain much of it." }
    ]},
  { id:"mgt-op", name:"Operations and Supply Chain",
    about:"How companies produce goods and services and get them to customers, from factories and warehouses to global networks of suppliers.",
    terms:["operations management","supply chain management","lean manufacturing","just-in-time production","supply chain resilience","reshoring","warehouse automation","supplier diversification","forced labor in supply chains"],
    questions:[
    { original:"Should firms optimize for efficiency (lean, just-in-time) or for resilience?",
      question:"Should companies run as efficiently as possible, or keep extra inventory and backup suppliers in case something goes wrong?",
      background:"“Just-in-time” production, developed by Toyota, keeps inventory to a minimum: parts arrive exactly when they are needed. This cuts costs and waste. But when COVID disrupted supply chains, companies with no spare parts had to stop production, and carmakers lost billions in sales during the chip shortage. Being “resilient” means paying for extra inventory and backup options that may never be used.",
      positionA:"Efficiency. Extra inventory is waste that customers end up paying for.",
      positionB:"Resilience. The cost of a shutdown far outweighs the cost of a buffer." },
    { original:"Is reshoring production economically viable?",
      question:"Can it make economic sense for a company to move its manufacturing back to a high-wage country like the U.S.?",
      background:"Labor costs much more in the U.S. than in China, Vietnam, or Mexico. But automation reduces how much labor costs matter, tariffs make imports more expensive, and shipping disruptions have made long supply chains riskier. Some companies are building new U.S. factories, especially for computer chips and batteries, often with government subsidies.",
      positionA:"Yes. Automation and risk have changed the math.",
      positionB:"No. Without subsidies, the costs are still too high." },
    { original:"Does automation in warehouses and factories create or destroy good jobs?",
      question:"Does automation in warehouses and factories create good jobs, or eliminate them?",
      background:"Amazon now uses more than a million robots in its warehouses. Automation can eliminate repetitive work and reduce injuries, while creating new jobs maintaining and running machines. Research by Daron Acemoglu and Pascual Restrepo found that U.S. areas that adopted more industrial robots saw lower employment and wages. Other studies find that companies that automate grow and end up hiring more people.",
      positionA:"It creates good jobs. Safer, more skilled work replaces repetitive tasks.",
      positionB:"It eliminates jobs. Machines replace far more workers than they employ." },
    { original:"Can supply chains be made truly sustainable and transparent?",
      question:"Can global supply chains be made truly sustainable and transparent?",
      background:"A smartphone can contain materials from dozens of countries that pass through many suppliers, and companies often don't know who their suppliers' suppliers are. Problems like forced labor, child labor, and deforestation can be hidden deep in these chains. Laws such as the 2021 U.S. ban on goods made with forced labor in China's Xinjiang region now require companies to trace where their materials come from. Critics doubt full visibility is possible.",
      positionA:"Yes. With technology and legal pressure, full tracing is achievable.",
      positionB:"No. The chains are too complex, and inspections can be faked." },
    { original:"Should firms concentrate suppliers to get better terms, or diversify to reduce risk?",
      question:"Should companies buy from just a few suppliers to get better deals, or spread their purchases out to reduce risk?",
      background:"Buying from a single supplier lets a company negotiate lower prices and build a close working relationship. But if that supplier is knocked out by a fire, a flood, or a war, production stops. After the 2011 earthquake in Japan damaged a single major chip factory, carmakers around the world had to slow production.",
      positionA:"Concentrate. Close partnerships mean better prices and quality.",
      positionB:"Diversify. Depending on one supplier is a risk not worth taking." }
    ]},
  { id:"mgt-cg", name:"Corporate Governance",
    about:"How companies are controlled and held accountable: the relationships among shareholders, boards of directors, and executives.",
    terms:["corporate governance","board of directors","fiduciary duty","stakeholder capitalism","codetermination","dual-class shares","CEO pay ratio","shareholder activism","board diversity"],
    questions:[
    { original:"Should corporations serve shareholders or stakeholders?",
      question:"Should corporations be run for their shareholders, or for all their “stakeholders,” including employees, customers, and communities?",
      background:"U.S. corporate law generally says a company's board of directors owes its duties to the company and its shareholders. “Stakeholder capitalism” argues that companies should also be governed in the interests of workers, customers, suppliers, and communities. In Germany, for example, workers elect up to half of the board members at large companies, a system called “codetermination.” Critics ask how a board can be held accountable if it serves many groups with conflicting interests.",
      positionA:"Shareholders. Owners should control the company they own.",
      positionB:"Stakeholders. Everyone affected by a company deserves a voice in how it is run." },
    { original:"Do dual-class shares protect long-term vision, or entrench founders?",
      question:"Do share structures that give founders extra voting power protect long-term thinking, or shield founders from accountability?",
      background:"“Dual-class” share structures give some shareholders, usually the founders, more votes per share than everyone else. Mark Zuckerberg controls a majority of the votes at Meta while owning about 13% of its shares. Founders argue this lets them pursue long-term plans without pressure from short-term investors. Critics argue it lets founders ignore the shareholders who provided most of the money.",
      positionA:"It protects long-term thinking. Founders can make bold bets.",
      positionB:"It shields founders. No one can hold them accountable." },
    { original:"Is CEO pay too high relative to performance?",
      question:"Is CEO pay too high compared with how well companies actually perform?",
      background:"In 2023, CEOs of the largest U.S. companies earned roughly 290 times as much as their typical workers, compared with about 20 times in 1965. Most CEO pay now comes as company stock, which supporters argue ties pay to performance. Critics argue that boards, whose members are often chosen with the CEO's input, approve generous pay, and that pay often rises even when performance doesn't.",
      positionA:"Too high. Pay has outgrown any reasonable link to performance.",
      positionB:"Justified. Skilled leaders of huge companies create enormous value." },
    { original:"Does activist investing improve companies, or force short-termism?",
      question:"Do activist investors improve companies, or push them toward short-term thinking?",
      background:"“Activist” investors, often hedge funds, buy stakes in companies they believe are underperforming and push for changes: new board members, cost cuts, selling off divisions, or stock buybacks. Research by Lucian Bebchuk and colleagues found that company performance tends to improve in the five years after activist campaigns. Critics argue activists profit by cutting research and other investments that would pay off later.",
      positionA:"They improve companies. Activists hold underperforming managers accountable.",
      positionB:"They push short-term thinking. They cut long-term investment for quick gains." },
    { original:"Do diverse boards make better decisions?",
      question:"Do more diverse boards of directors make better decisions?",

const SUBS = {}, QS = {};
FIELDS.forEach(f => f.subfields.forEach(s => {
  s.field = f; SUBS[s.id] = s;
  s.questions.forEach((q, i) => { q.id = s.id + "-" + (i + 1); q.sub = s; QS[q.id] = q; });
}));
const TOTAL_Q = Object.keys(QS).length;

const app = document.getElementById("app");
const KEY = "faculty-quiz-v1";

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

function fresh(){
  const seed = {};
  FIELDS.forEach(f => { seed[f.id] = Math.random(); f.subfields.forEach(s => seed[s.id] = Math.random()); });
  return { view:"intro", stage:0, queue:[], pos:0, answers:{}, topFields:[], deep:[], exploring:null, seed };
}
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (!s || !s.answers || !s.seed) return null;
    if (s.queue.some(id => !QS[id]) || Object.keys(s.answers).some(id => !QS[id])) return null;
    return s;
  } catch (e) { return null; }
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
let state = load() || fresh();

/* ---------- scoring ---------- */
const complete = a => a && a.s !== undefined && a.i !== undefined;
function qScore(a){ return a.i + 0.5 * Math.abs(a.s); }   // interest 1–5 plus up to 1 point for a strong opinion
function statsFor(questions){
  let n = 0, sum = 0, conv = 0;
  questions.forEach(q => { const a = state.answers[q.id]; if (complete(a)){ n++; sum += qScore(a); conv += Math.abs(a.s); } });
  return { n, avg: n ? sum / n : 0, conv };
}
const subStats = s => statsFor(s.questions);
const fieldStats = f => statsFor(f.subfields.flatMap(s => s.questions));
function rank(items, fn){
  return items.map(x => ({ x, st: fn(x) }))
    .sort((p, q) => (q.st.avg - p.st.avg) || (q.st.conv - p.st.conv) || (state.seed[q.x.id] - state.seed[p.x.id]))
    .map(o => o.x);
}
const unasked = s => s.questions.filter(q => !state.answers[q.id]);

/* ---------- stage builders ---------- */
function buildStage1(){
  const q = [];
  FIELDS.forEach(f => shuffle(f.subfields).slice(0, 2).forEach(s => q.push(pick(s.questions).id)));
  return shuffle(q);
}
function buildStage2(){
  const top = rank(FIELDS, fieldStats).slice(0, 2);
  state.topFields = top.map(f => f.id);
  const q = [];
  top.forEach(f => f.subfields.forEach(s => { const u = unasked(s); if (u.length) q.push(pick(u).id); }));
  return shuffle(q);
}
function buildStage3(){
  const pool = FIELDS.filter(f => state.topFields.includes(f.id)).flatMap(f => f.subfields);
  const top = rank(pool, subStats).slice(0, 3);
  state.deep = top.map(s => s.id);
  return shuffle(top.flatMap(s => unasked(s).map(q => q.id)));
}

/* ---------- flow ---------- */
function go(view){ state.view = view; save(); render(); window.scrollTo(0, 0); const h = app.querySelector("h1,h2"); if (h){ h.setAttribute("tabindex", "-1"); h.focus({ preventScroll:true }); } }
function start(){ state = fresh(); state.stage = 1; state.queue = buildStage1(); state.pos = 0; go("quiz"); }
function next(){
  if (!complete(state.answers[state.queue[state.pos]])) return;
  if (state.pos < state.queue.length - 1){ state.pos++; go("quiz"); return; }
  if (state.stage === 1){ state.stage = 2; state.queue = buildStage2(); state.pos = 0; go("break"); }
  else if (state.stage === 2){ state.stage = 3; state.queue = buildStage3(); state.pos = 0; state.queue.length ? go("break") : go("results"); }
  else if (state.stage === "explore"){ if (!state.deep.includes(state.exploring)) state.deep.push(state.exploring); state.exploring = null; go("results"); }
  else go("results");
}
function back(){ if (state.pos > 0){ state.pos--; go("quiz"); } }
function explore(id){
  const s = SUBS[id]; if (!s) return;
  const u = unasked(s);
  if (!u.length){ if (!state.deep.includes(id)) state.deep.push(id); go("results"); return; }
  state.stage = "explore"; state.exploring = id; state.queue = shuffle(u.map(q => q.id)); state.pos = 0; go("quiz");
}

/* ---------- views ---------- */
function topbar(extra){
  return `<div class="topbar no-print"><span class="brand">Business Faculty Appointments</span><span class="actions">${extra || ""}</span></div>`;
}
const resetBtn = `<button type="button" class="linkish" data-action="reset">Start over</button>`;

function renderIntro(){
  app.innerHTML = `
    ${topbar(`<button type="button" class="linkish" data-action="review">Instructor view: all ${TOTAL_Q} questions</button>`)}
    <div class="stack">
      <h1>Which business professorship fits you?</h1>
      <p class="lede">You'll answer about 30 questions on real debates in business. Each one asks where you stand and how interested you'd be in researching it. At the end, you'll be appointed professor of one field, with a specialty, and you'll get the research questions you'll represent.</p>
    </div>
    <div class="panel">

        <li><span class="n">1</span><div><b>Ten questions from across business</b><span class="muted">Accountancy, economics, finance, management, and marketing. These point toward the two fields that fit you best.</span></div></li>
        <li><span class="n">2</span><div><b>Ten questions inside those two fields</b><span class="muted">One from each specialty, to find which specialties interest you most.</span></div></li>
        <li><span class="n">3</span><div><b>The remaining questions in your top three specialties</b><span class="muted">These decide your final appointment.</span></div></li>
      </ol>
    </div>
    <div class="stack small muted">
      <p>Every question has two positions. You can agree strongly with either one, lean toward one, or say you're undecided. There are no right answers, and nothing is graded. Field names stay hidden until the end so they don't steer your answers.</p>
      <p>Your progress is saved in this browser, so you can close the page and come back.</p>
    </div>
    <div class="actions"><button type="button" class="btn" data-action="start">Start the quiz</button></div>`;
}

function renderBreak(){
  const n = state.queue.length;
  const copy = state.stage === 2
    ? { h:"Part 2 of 3", p:`Ten more questions. Based on part 1, these narrow down which specialties interest you most.` }
    : { h:"Part 3 of 3", p:`${n} final questions, drawn from your three highest-scoring specialties. These decide your appointment.` };
  app.innerHTML = `
    ${topbar(resetBtn)}
    <div class="stack">
      <h2>${copy.h}</h2>
      <p class="lede">${copy.p}</p>
    </div>
    <div class="actions"><button type="button" class="btn" data-action="continue">Continue</button></div>`;
}

const STANCE = [
  { v:-2, top:"Strongly", bot:"A", cls:"a", label:"Strongly agree with Position A" },
  { v:-1, top:"Lean", bot:"A", cls:"a", label:"Lean toward Position A" },
  { v:0,  top:"Undecided", bot:"", cls:"mid", label:"Undecided between the two positions" },
  { v:1,  top:"Lean", bot:"B", cls:"b", label:"Lean toward Position B" },
  { v:2,  top:"Strongly", bot:"B", cls:"b", label:"Strongly agree with Position B" }
];
const INTEREST = [[1,"Not at all"],[2,"A little"],[3,"Somewhat"],[4,"Quite"],[5,"Very"]];

function renderQuiz(){
  const id = state.queue[state.pos], q = QS[id];
  if (!q){ go("intro"); return; }
  const a = state.answers[id] || {};
  const total = state.queue.length, last = state.pos === total - 1;
  const explore = state.stage === "explore";
  const parts = explore
    ? `<span class="on">Extra specialty</span>`
    : [1,2,3].map(n => `<span class="${n === state.stage ? "on" : n < state.stage ? "done" : ""}">Part ${n}</span>`).join("");
  let nextLabel = "Next question";
  if (last) nextLabel = (state.stage === 3 || explore) ? "See my appointment" : "Finish part " + state.stage;
  app.innerHTML = `
    ${topbar(resetBtn)}
    <div class="qhead">
      <div class="parts" aria-label="Quiz parts">${parts}</div>
      <div class="prog"><span>Question ${state.pos + 1} of ${total}</span><div class="bar" aria-hidden="true"><i style="width:${(state.pos + 1) / total * 100}%"></i></div></div>
    </div>
    <h2>${esc(q.question)}</h2>
    <div class="bg"><div class="bg-label">Background</div><p>${esc(q.background)}</p></div>
    <fieldset>
      <legend>Where do you stand?</legend>
      <div class="sides">
        <div class="side a"><span class="tag">Position A</span>${esc(q.positionA)}</div>
        <div class="side b"><span class="tag">Position B</span>${esc(q.positionB)}</div>
      </div>
      <div class="scale">
        ${STANCE.map((o, k) => `<label class="seg ${o.cls}"><input type="radio" name="stance" id="stance-${k}" value="${o.v}" aria-label="${o.label}" ${a.s === o.v ? "checked" : ""}><span>${o.top}${o.bot ? `<b>${o.bot}</b>` : ""}</span></label>`).join("")}
      </div>
    </fieldset>
    <fieldset>
      <legend>How interested would you be in researching this question?</legend>
      <div class="scale">
        ${INTEREST.map(([v, l]) => `<label class="seg int"><input type="radio" name="interest" id="interest-${v}" value="${v}" aria-label="${v} of 5: ${l}" ${a.i === v ? "checked" : ""}><span><b>${v}</b>${l}</span></label>`).join("")}
      </div>
    </fieldset>
    <div class="qnav">
      <button type="button" class="btn ghost" data-action="back" ${state.pos === 0 ? "disabled" : ""}>Back</button>
      <span class="hint" id="hint">${complete(a) ? "" : "Choose a position and an interest level to continue."}</span>
      <button type="button" class="btn" id="nextBtn" data-action="next" ${complete(a) ? "" : "disabled"}>${nextLabel}</button>
    </div>`;
}

function positionLine(q){
  const a = state.answers[q.id];
  if (!complete(a)) return { text:"Not answered.", cls:"" };
  if (a.s === 0) return { text:"You were <em>undecided</em> between the two positions.", cls:"" };
  const side = a.s < 0 ? q.positionA : q.positionB;
  const verb = Math.abs(a.s) === 2 ? "strongly agreed with" : "leaned toward";
  return { text:`You ${verb} ${a.s < 0 ? "Position A" : "Position B"}: <em>${esc(side)}</em>`, cls: a.s < 0 ? "a" : "b" };
}

function renderResults(){
  const deepSubs = state.deep.map(id => SUBS[id]).filter(Boolean);
  if (!deepSubs.length){ go("intro"); return; }
  const ranked = rank(deepSubs, subStats);
  const win = ranked[0], others = ranked.slice(1);
  const answered = Object.values(state.answers).filter(complete).length;
  const agenda = win.questions.map((q, k) => ({ q, k, a: state.answers[q.id] }))
    .sort((x, y) => ((y.a ? y.a.i : 0) - (x.a ? x.a.i : 0)) || (x.k - y.k));
  const fieldRank = rank(FIELDS, fieldStats);
  const bar = (label, st, isWin) => `<div class="brow ${isWin ? "win" : ""}"><span class="lbl">${esc(label)}</span><span class="trk"><i style="width:${(st.avg / 6 * 100).toFixed(1)}%"></i></span><span class="val">${st.avg.toFixed(1)}</span></div>`;
  const remaining = FIELDS.map(f => {
    const opts = f.subfields.filter(s => !state.deep.includes(s.id)).map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("");
    return opts ? `<optgroup label="${esc(f.name)}">${opts}</optgroup>` : "";
  }).join("");

  app.innerHTML = `
    ${topbar(resetBtn)}
    <div class="appointment">
      <div class="appointment-inner">
        <span class="kicker">Faculty appointment</span>
        <h1>Professor of ${esc(win.field.name)}</h1>
        <span class="spec">specializing in ${esc(win.name)}</span>
        <span class="basis">Based on your answers to ${answered} questions</span>
      </div>
    </div>

    <section class="stack">
      <h3>Your field</h3>
      <p>${esc(win.field.about)}</p>
      <p><strong>${esc(win.name)}:</strong> ${esc(win.about)}</p>
    </section>

    <section class="stack">
      <h3>Your research questions</h3>
      <p class="muted small">These are the five questions your specialty debates, ordered by how interested you said you were. Your answers are your starting positions. Your research should test them by finding the strongest evidence on both sides.</p>
      <ol class="agenda">
        ${agenda.map(({ q, a }) => { const p = positionLine(q); return `
          <li>
            <span class="rq">${esc(q.original)}</span>
            <span class="pos">${p.text}</span>
            <span class="meta"><span class="pill">Interest ${a ? a.i : "–"} of 5</span>${p.cls ? `<span class="pill ${p.cls}">${Math.abs(a.s) === 2 ? "Strong" : "Leaning"} opinion</span>` : `<span class="pill">Undecided</span>`}</span>
          </li>`; }).join("")}
      </ol>
    </section>

    <section class="stack">
      <h3>Search terms to start with</h3>
      <div class="chips">${win.terms.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
    </section>

    <section class="stack">
      <h3>Close runners-up</h3>
      <div class="panel">
        ${others.map(s => `<div class="runner"><b>${esc(s.field.name)}: ${esc(s.name)}</b><span class="muted small">${esc(s.about)}</span></div>`).join("")}
      </div>
    </section>

    <section class="stack">
      <h3>How your scores came out</h3>
      <p class="muted small">Each answer scores 1 to 6: your interest rating (1–5), plus up to one extra point for a strong opinion on either side. Bars show your average per question. Your appointment is the specialty with the highest average among the ones where you answered all five questions.</p>
      <div class="panel stack">
        <span class="small"><strong>Specialties you completed</strong></span>
        <div class="bars">${ranked.map((s, k) => bar(s.name, subStats(s), k === 0)).join("")}</div>
        <span class="small" style="margin-top:8px"><strong>Fields</strong></span>
        <div class="bars">${fieldRank.map(f => bar(f.name, fieldStats(f), f === win.field)).join("")}</div>
      </div>
    </section>

    ${remaining ? `<section class="stack no-print">
      <h3>Explore another specialty</h3>
      <p class="muted small">Curious about a different area? Answer its remaining questions. If it outscores your current specialty, your appointment will change.</p>
      <div class="actions">
        <label for="explore-select" class="small" style="position:absolute;left:-9999px">Choose a specialty</label>
        <select id="explore-select"><option value="">Choose a specialty…</option>${remaining}</select>
        <button type="button" class="btn ghost" id="exploreBtn" data-action="explore" disabled>Answer its questions</button>
      </div>
    </section>` : ""}`;
}

function renderReview(){
  const nav = FIELDS.map(f => `<button type="button" class="btn ghost small" data-action="jump" data-target="rv-${f.id}">${esc(f.name)}</button>`).join("");
  app.innerHTML = `
    ${topbar(`<button type="button" class="linkish" data-action="quiz">Back to the quiz</button>`)}
    <div class="stack">
      <h1>All ${TOTAL_Q} questions</h1>
      <p class="lede">Every question in the bank, grouped by field and specialty, with the wording students see, the background they read, and the two positions they choose between.</p>
    </div>
    <div class="panel stack small">
      <strong>How the quiz works</strong>
      <p><b>Part 1 (10 questions):</b> two questions from each of the five fields, each from a different randomly chosen specialty, shown in random order without field labels. The two fields with the highest average score go forward.</p>
      <p><b>Part 2 (10 questions):</b> one unanswered question from each of the ten specialties in those two fields. The three specialties with the highest average score go forward.</p>
      <p><b>Part 3 (about 9–12 questions):</b> every remaining question in those three specialties, so the student has answered all five in each. The highest-scoring of the three becomes the appointment; the other two are listed as runners-up.</p>
      <p><b>Scoring:</b> each answer = interest rating (1–5) + 0.5 × opinion strength (0 for undecided, 1 for leaning, 2 for strongly agreeing with either side). That gives 1 to 6 per question. Rankings use the average per question; ties go to the area with stronger opinions, then to a random order fixed for each student.</p>
      <p><b>Afterward:</b> students can complete any other specialty from the results page. Their appointment is always the highest-scoring specialty among those they completed.</p>
      <p><b>Editing:</b> all questions live in the <code>FIELDS</code> list at the top of the page's script. Question IDs (such as ACC-FR-1) come from their position in that list.</p>
    </div>
    <div class="jump no-print">${nav}</div>
    ${FIELDS.map(f => `
      <section class="rv-field" id="rv-${f.id}">
        <h2>${esc(f.name)}</h2>
        <p class="muted">${esc(f.about)}</p>
        ${f.subfields.map(s => `
          <div class="rv-sub">
            <div class="rv-head">
              <h3 class="rv-title">${esc(s.name)}</h3>
              <p class="small">${esc(s.about)}</p>
              <p class="small muted"><strong>Search terms:</strong> ${s.terms.map(esc).join(" · ")}</p>
            </div>
            ${s.questions.map(q => `
              <dl class="rv-q">
                <span class="qid">${q.id.toUpperCase()}</span>
                <dt>Original</dt><dd>${esc(q.original)}</dd>
                <dt>Student sees</dt><dd class="prompt">${esc(q.question)}</dd>
                <dt>Background</dt><dd>${esc(q.background)}</dd>
                <dt>Position A</dt><dd class="pa">${esc(q.positionA)}</dd>
                <dt>Position B</dt><dd class="pb">${esc(q.positionB)}</dd>
              </dl>`).join("")}
          </div>`).join("")}
      </section>`).join("")}`;
}

function isReview(){
  return location.hash === "#review" || (!location.hash && new URLSearchParams(location.search).has("review"));
}
function render(){
  if (isReview()) return renderReview();
  ({ intro:renderIntro, quiz:renderQuiz, break:renderBreak, results:renderResults }[state.view] || renderIntro)();
}

/* ---------- events ---------- */
let resetTimer = null;
app.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b) return;
  const act = b.dataset.action;
  if (act === "start") start();
  else if (act === "next") next();
  else if (act === "back") back();
  else if (act === "continue") go("quiz");
  else if (act === "review"){ location.hash = "review"; }
  else if (act === "quiz"){ location.hash = "quiz"; }
  else if (act === "jump"){ const t = document.getElementById(b.dataset.target); if (t) t.scrollIntoView({ behavior:"smooth" }); }
  else if (act === "explore"){ const v = document.getElementById("explore-select").value; if (v) explore(v); }
  else if (act === "reset"){
    if (b.dataset.armed){ clearTimeout(resetTimer); state = fresh(); go("intro"); }
    else { b.dataset.armed = "1"; b.textContent = "Click again to erase all answers"; resetTimer = setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = "Start over"; } }, 4000); }
  }
});
app.addEventListener("change", e => {
  const t = e.target;
  if (t.name === "stance" || t.name === "interest"){
    const id = state.queue[state.pos];
    const a = state.answers[id] || (state.answers[id] = {});
    if (t.name === "stance") a.s = Number(t.value); else a.i = Number(t.value);
    save();
    const ok = complete(a);
    document.getElementById("nextBtn").disabled = !ok;
    document.getElementById("hint").textContent = ok ? "" : "Choose a position and an interest level to continue.";
  }
  if (t.id === "explore-select") document.getElementById("exploreBtn").disabled = !t.value;
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();
</script>
